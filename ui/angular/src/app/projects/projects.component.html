<p class="muted" *ngIf="loading">Loading projects…</p>

<div class="projects" *ngIf="!loading">
  <div class="toolbar">
    <input class="input" placeholder="Search projects" [(ngModel)]="search" />
    <select class="select" [(ngModel)]="sortKey">
      <option value="name">Name</option>
      <option value="status">Status</option>
      <option value="created_at">Created</option>
    </select>
    <button class="btn" (click)="toggleDir()">
      {{ sortDir === 'asc' ? 'Ascending' : 'Descending' }}
    </button>
  </div>

  <p class="muted" *ngIf="visibleProjects.length === 0">No projects yet.</p>

  <table class="table" *ngIf="visibleProjects.length > 0">
    <thead>
      <tr>
        <th>Name</th>
        <th>Status</th>
        <th>Created</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let p of visibleProjects">
        <td>{{ p.name }}</td>
        <td><span class="badge badge-{{ p.status }}">{{ p.status }}</span></td>
        <td>{{ p.created_at | date: 'mediumDate' }}</td>
      </tr>
    </tbody>
  </table>
</div>
